<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request · CampusFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div id="app-nav"></div>

<main class="container pb-5">
    <div id="page"></div>
</main>

<!-- One dialog serves all five actions; the wording is set when it opens. -->
<div class="modal fade" id="action-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="action-form" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="action-title">Confirm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-secondary small" id="action-explainer"></p>
                    <div id="note-wrap">
                        <label for="note" class="form-label" id="note-label">Note</label>
                        <textarea class="form-control" id="note" name="note" rows="3" maxlength="1000"></textarea>
                        <div class="invalid-feedback" data-error-for="note"></div>
                    </div>
                    <div class="alert alert-danger py-2 px-3 small mt-3 d-none" data-form-error role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="action-submit">Confirm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="assign-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="assign-form" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title">Assign this request</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="technicianId" class="form-label">Technician</label>
                        <select class="form-select" id="technicianId" name="technicianId" required></select>
                        <div class="form-text">The number in brackets is how much each one is already carrying.</div>
                        <div class="invalid-feedback" data-error-for="technicianId"></div>
                    </div>
                    <div class="mb-1">
                        <label for="assign-note" class="form-label">
                            Note <span class="text-secondary fw-normal">(optional)</span>
                        </label>
                        <input type="text" class="form-control" id="assign-note" name="note" maxlength="255"
                               placeholder="Why this person?">
                    </div>
                    <div class="alert alert-danger py-2 px-3 small mt-3 d-none" data-form-error role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="assign-submit">Assign</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/request-detail.js"></script>
</body>
</html>
