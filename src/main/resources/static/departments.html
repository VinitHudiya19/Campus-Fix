<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Departments · CampusFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div id="app-nav"></div>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
        <div>
            <h1 class="h4 mb-1">Departments</h1>
            <p class="text-secondary mb-0">The teams that fix things. Every category belongs to one.</p>
        </div>
        <button class="btn btn-primary" type="button" id="add-button">Add department</button>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>All departments</span>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="show-inactive">
                <label class="form-check-label small" for="show-inactive">Show inactive</label>
            </div>
        </div>
        <div id="table"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script src="js/pages/departments.js"></script>
</body>
</html>
