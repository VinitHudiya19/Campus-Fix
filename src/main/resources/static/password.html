<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password · CampusFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div id="app-nav"></div>

<main class="container pb-5">
    <div class="row">
        <div class="col-lg-6">
            <h1 class="h4 mb-1">Change your password</h1>
            <p class="text-secondary">
                You will stay signed in on this device. Other devices keep working
                until their session ends.
            </p>

            <div class="card">
                <div class="card-body p-4">
                    <form id="password-form" novalidate>
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Current password</label>
                            <input type="password" class="form-control" id="currentPassword"
                                   name="currentPassword" autocomplete="current-password" required>
                            <div class="invalid-feedback" data-error-for="currentPassword"></div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New password</label>
                            <input type="password" class="form-control" id="newPassword"
                                   name="newPassword" autocomplete="new-password" minlength="8" required>
                            <div class="form-text">At least 8 characters.</div>
                            <div class="invalid-feedback" data-error-for="newPassword"></div>
                        </div>

                        <div class="mb-3">
                            <label for="repeatPassword" class="form-label">Type it again</label>
                            <input type="password" class="form-control" id="repeatPassword"
                                   autocomplete="new-password" required>
                            <div class="invalid-feedback" data-error-for="repeatPassword"></div>
                        </div>

                        <div class="alert alert-danger py-2 px-3 small d-none" data-form-error role="alert"></div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" id="submit">Change password</button>
                            <a href="index.html" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/password.js"></script>
</body>
</html>
