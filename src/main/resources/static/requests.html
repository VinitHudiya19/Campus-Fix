<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Requests · CampusFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div id="app-nav"></div>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
        <div>
            <h1 class="h4 mb-1" id="page-title">Requests</h1>
            <p class="text-secondary mb-0" id="page-subtitle"></p>
        </div>
        <div id="primary-action"></div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form id="filters" class="row g-2 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="search" class="form-label small mb-1">Search</label>
                    <input type="search" class="form-control form-control-sm" id="search" name="search"
                           placeholder="Number, title or description" maxlength="100">
                </div>
                <div class="col-6 col-md-3">
                    <label for="sort" class="form-label small mb-1">Sort by</label>
                    <select class="form-select form-select-sm" id="sort" name="sort">
                        <option value="createdAt,desc">Newest first</option>
                        <option value="createdAt,asc">Oldest first</option>
                        <option value="dueAt,asc">Due soonest</option>
                        <option value="priority,desc">Highest priority</option>
                        <option value="status,asc">Status</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label for="status" class="form-label small mb-1">Status</label>
                    <select class="form-select form-select-sm" id="status" name="status">
                        <option value="">Any status</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label for="categoryId" class="form-label small mb-1">Category</label>
                    <select class="form-select form-select-sm" id="categoryId" name="categoryId">
                        <option value="">Any category</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label for="priority" class="form-label small mb-1">Priority</label>
                    <select class="form-select form-select-sm" id="priority" name="priority">
                        <option value="">Any priority</option>
                    </select>
                </div>
                <div class="col-6 col-md-2 d-none" id="unassigned-wrap">
                    <div class="form-check mb-1">
                        <input class="form-check-input" type="checkbox" id="unassignedOnly">
                        <label class="form-check-label small" for="unassignedOnly">Unassigned only</label>
                    </div>
                </div>
                <div class="col-12 col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-sm btn-primary flex-fill">Filter</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="reset">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div id="results"></div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center d-none" id="pager">
            <span class="small text-secondary" id="pager-info"></span>
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" id="prev" type="button">Previous</button>
                <button class="btn btn-outline-secondary" id="next" type="button">Next</button>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/requests.js"></script>
</body>
</html>
