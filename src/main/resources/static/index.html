<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard · CampusFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div id="app-nav"></div>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
        <div>
            <h1 class="h4 mb-1" id="greeting">Dashboard</h1>
            <p class="text-secondary mb-0" id="subtitle"></p>
        </div>
        <div id="primary-action"></div>
    </div>

    <div class="row g-3 mb-4" id="stats"></div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span id="recent-title">Recent requests</span>
            <a href="requests.html" class="btn btn-sm btn-outline-secondary">See all</a>
        </div>
        <div id="recent"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
