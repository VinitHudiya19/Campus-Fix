<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report a problem · CampusFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div id="app-nav"></div>

<main class="container pb-5">
    <div class="mb-4">
        <h1 class="h4 mb-1">Report a problem</h1>
        <p class="text-secondary mb-0">
            Choose the kind of problem and the right team is worked out for you.
        </p>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body p-4">
                    <form id="request-form" novalidate>
                        <div class="mb-3">
                            <label for="title" class="form-label">What is wrong?</label>
                            <input type="text" class="form-control" id="title" name="title"
                                   maxlength="150" placeholder="Wi-Fi is down in the library" required>
                            <div class="form-text">A short summary, so staff can scan the list.</div>
                            <div class="invalid-feedback" data-error-for="title"></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Tell us more</label>
                            <textarea class="form-control" id="description" name="description"
                                      rows="4" maxlength="2000" required
                                      placeholder="When did it start? Which room? Anything you have already tried?"></textarea>
                            <div class="form-text"><span id="chars">0</span> / 2000 characters</div>
                            <div class="invalid-feedback" data-error-for="description"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="categoryId" class="form-label">Kind of problem</label>
                                <select class="form-select" id="categoryId" name="categoryId" required>
                                    <option value="">Choose…</option>
                                </select>
                                <div class="form-text" id="routing-hint">&nbsp;</div>
                                <div class="invalid-feedback" data-error-for="categoryId"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="priority" class="form-label">How urgent is it?</label>
                                <select class="form-select" id="priority" name="priority" required></select>
                                <div class="form-text" id="sla-hint">&nbsp;</div>
                                <div class="invalid-feedback" data-error-for="priority"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="locationId" class="form-label">
                                Where is it? <span class="text-secondary fw-normal">(optional)</span>
                            </label>
                            <select class="form-select" id="locationId" name="locationId">
                                <option value="">Not tied to one place</option>
                            </select>
                            <div class="invalid-feedback" data-error-for="locationId"></div>
                        </div>

                        <div class="alert alert-danger py-2 px-3 small d-none" data-form-error role="alert"></div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" id="submit">Send request</button>
                            <a href="requests.html" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card">
                <div class="card-header">How long will it take?</div>
                <div class="card-body" id="sla-table"></div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/request-new.js"></script>
</body>
</html>
