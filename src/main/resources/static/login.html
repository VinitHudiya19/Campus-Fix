<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · CampusFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div class="login-shell">
    <div class="text-center mb-4">
        <h1 class="h3 mb-1">CampusFix</h1>
        <p class="text-secondary mb-0">Report a campus problem and follow it through</p>
    </div>

    <div class="card">
        <div class="card-body p-4">
            <div id="session-notice" class="alert alert-warning py-2 px-3 small d-none" role="status">
                Your session has ended. Please sign in again.
            </div>

            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">College email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           autocomplete="username" required autofocus>
                    <div class="invalid-feedback" data-error-for="email"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                    <div class="invalid-feedback" data-error-for="password"></div>
                </div>

                <div class="alert alert-danger py-2 px-3 small d-none" data-form-error role="alert"></div>

                <button type="submit" class="btn btn-primary w-100" id="submit">Sign in</button>
            </form>
        </div>
    </div>

    <p class="text-center text-secondary small mt-3 mb-0">
        Accounts are created by the college administrator.
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
