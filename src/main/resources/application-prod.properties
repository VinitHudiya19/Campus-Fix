# Settings for a real server. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# The defaults in application.properties are tuned for a developer watching a
# console. On a server they are noise at best and a disclosure risk at worst.

# Every statement Hibernate runs was being printed. On a server that fills the
# log with SQL nobody reads and buries the lines that matter.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.campusfix=INFO
logging.level.org.hibernate.SQL=WARN

# The schema is still managed by Hibernate, which is the honest state of this
# project — "validate" would be the setting once Flyway owns migrations. Left as
# "update" so a first deployment creates its own tables, and flagged in the
# README as the main thing to change before this carried real data.
spring.jpa.hibernate.ddl-auto=update

# Never let a stack trace reach the browser. The global exception handler
# already returns a neutral message; this closes the other route.
server.error.include-stacktrace=never
server.error.include-message=never

# Behind a reverse proxy the app sees the proxy's address and http, not the
# client's address and https. Without this, redirects and any generated links
# point at http and the logs record the proxy as every caller.
server.forward-headers-strategy=framework

# Long-lived connections cost nothing to hold and everything to re-establish
# under load. Modest pool: the free tiers this is aimed at cap connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=20000

# Gzip the JSON and the static files. The request list is the biggest response
# in the app and compresses to a fraction of its size.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024
