spring.application.name=CampusFix

# Hosting platforms assign the port and pass it in as PORT — Render, Heroku and
# Cloud Run all do this. Binding to a fixed 8080 means the platform's health
# check hits a port nothing is listening on and the deploy is marked failed.
server.port=${PORT:8080}

# Credentials come from the environment. The defaults only exist so a fresh
# clone runs on a standard local MySQL install; never use them on a server.
# sslMode is a variable because a hosted MySQL — TiDB Cloud, Aiven, PlanetScale —
# refuses an unencrypted connection, while a local install has no certificate to
# offer. DISABLED locally, VERIFY_IDENTITY against a hosted one.
# The whole URL can also be replaced by setting SPRING_DATASOURCE_URL.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusfix}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates and alters tables from the entity classes during
# development. It never drops columns, so existing data survives a restart.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL DATETIME stores no timezone. Without this, Hibernate would write
# timestamps using whatever timezone the JVM happens to run in, and the same
# database read from another machine would report different times. Everything is
# written and read as UTC instead.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Close the persistence session when the service method ends instead of keeping
# it open until the HTTP response is written. Lazy-loading mistakes then fail
# loudly in the service layer rather than silently firing extra queries.
spring.jpa.open-in-view=false

# --- Authentication -------------------------------------------------------
# Spring Boot would otherwise create a throwaway in-memory user and print a
# random password at every startup. This app authenticates against the users
# table through AuthService, so that default is only confusing noise.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# The signing key. Anyone holding it can mint a token for any user, so on a real
# server this must come from the environment and never from this file.
# Must be at least 32 characters: HS256 requires a 256-bit key.
campusfix.jwt.secret=${JWT_SECRET:campusfix-local-development-signing-key-change-me}

# Eight hours: long enough for a working day, short enough that a stolen token
# expires on its own. There are no refresh tokens, so this is the whole session.
campusfix.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:480}

# The first administrator, created on startup only when no admin exists yet.
# Without it nobody could log in, and only an admin can create users.
campusfix.admin.email=${ADMIN_EMAIL:admin@campusfix.local}
campusfix.admin.password=${ADMIN_PASSWORD:admin12345}

# --- Health ---------------------------------------------------------------
# Only the health endpoint is exposed. The others report bean names, mappings
# and configuration, which is a description of the application handed to
# anyone who asks.
management.endpoints.web.exposure.include=health

# "UP" and nothing else to an anonymous caller. Showing which component is
# down tells an outsider that, say, the database is unreachable.
management.endpoint.health.show-details=never

# --- Attachments ----------------------------------------------------------
# Where uploaded photos go by default. Deliberately outside the folder the
# application serves: a web-reachable upload directory is how an uploaded file
# becomes an executable page. Override with STORAGE_LOCATION, or switch to
# object storage entirely by running with --spring.profiles.active=s3
campusfix.storage.location=${STORAGE_LOCATION:./campusfix-uploads}
campusfix.storage.max-file-size-bytes=5242880
campusfix.storage.max-files-per-request=5

# Used only under the s3 profile. Leave the endpoint empty for real AWS; point
# it at MinIO to run object storage locally.
campusfix.storage.bucket=${S3_BUCKET:campusfix}
campusfix.storage.endpoint=${S3_ENDPOINT:}
campusfix.storage.region=${S3_REGION:us-east-1}

# Tomcat's own limits. Slightly above the application's 5 MB so that an
# oversized file is refused by our code, with a readable message, rather than
# being cut off by the container first.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# --- Notifications --------------------------------------------------------
# In-app notifications always work. Email is an extra channel that only exists
# when a mail host is configured.
#
# spring.mail.host is deliberately NOT given a default here. Writing
# `spring.mail.host=${MAIL_HOST:}` sets it to an empty string, which counts as
# "present": Spring then builds a mail sender pointing nowhere, and Actuator's
# mail health check fails and reports the whole application DOWN. A hosting
# platform reads that as a failed deployment.
#
# Set these as environment variables instead — Spring maps SPRING_MAIL_HOST to
# spring.mail.host on its own:
#
#   SPRING_MAIL_HOST=smtp.gmail.com
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=you@gmail.com
#   SPRING_MAIL_PASSWORD=<16-character App Password, not your real password>
#
# A Gmail App Password requires 2-Step Verification on the account.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Even with a mail server configured, a temporary SMTP outage must not mark the
# application unhealthy — the platform would restart or fail a perfectly working
# instance. Notifications degrading is not the service being down.
management.health.mail.enabled=false

# Bounded so a mail server that accepts connections and then hangs cannot tie up
# a delivery thread indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

campusfix.mail.from=${MAIL_FROM:campusfix@localhost}

# Used to build the link in an email back to the request.
campusfix.base-url=${BASE_URL:http://localhost:8080}

# --- SLA and escalation ---------------------------------------------------
# How often the overdue check runs. Fifteen minutes is frequent enough that a
# breach is noticed the same working hour, and rare enough to cost nothing.
campusfix.sla.check-interval-ms=${SLA_CHECK_INTERVAL_MS:900000}

# Waits a minute after startup so a deployment does not run the check while the
# application is still warming up.
campusfix.sla.initial-delay-ms=${SLA_INITIAL_DELAY_MS:60000}

# How long after the deadline a still-unresolved request goes above the
# department head, to the administration.
campusfix.sla.escalation-grace-hours=${SLA_ESCALATION_GRACE_HOURS:24}

logging.level.com.campusfix=DEBUG
