# Loaded on top of application.properties when the "test" profile is active.
# Surefire activates that profile for every test run (see pom.xml), so the build
# never needs a running MySQL server.
#
# The file is named application-test.properties on purpose. A file named
# application.properties in src/test/resources would replace the main one
# instead of adding to it, and every setting would have to be repeated here.
spring.datasource.url=jdbc:h2:mem:campusfix;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Uploads during a test run go to the build folder, so they are cleaned by
# `mvn clean` and never appear in the working tree.
campusfix.storage.location=./target/test-uploads

logging.level.com.campusfix=INFO
